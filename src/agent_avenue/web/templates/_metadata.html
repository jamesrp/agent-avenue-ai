<aside class="metadata" aria-label="Reproduction metadata">
  <h2>Reproduce this game</h2>
  <dl>
    <div><dt>Seed</dt><dd><code>{{ metadata.seed }}</code></dd></div>
    <div><dt>Controllers</dt><dd>{{ metadata.controller_label }}</dd></div>
    <div><dt>Starting player</dt><dd>{{ metadata.starting_player }}</dd></div>
    <div><dt>Rules</dt><dd><code>{{ metadata.rules_version }}</code></dd></div>
    <div><dt>Shuffle</dt><dd><code>{{ metadata.shuffle_version }}</code></dd></div>
    <div><dt>Replay ID</dt><dd><code>{{ metadata.replay_id }}</code></dd></div>
    <div><dt>Public fingerprint</dt><dd><code>{{ metadata.public_fingerprint }}</code></dd></div>
  </dl>
</aside>
